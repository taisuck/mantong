# mantong 설정 파일 예시
# 이 파일을 config.yml 로 복사한 뒤 값을 채워 사용한다. (config.yml 은 git 에 올리지 않는다)
# 다른 경로의 설정 파일은 실행 시 -config 옵션으로 지정한다. 예) mantong -config /etc/mantong/config.yml

server:
  # 웹 서버가 listen 할 주소. 포트만 적으면(예: "8080") 모든 인터페이스의 해당 포트(":8080")로 동작한다.
  # 특정 IP 에만 열려면 "127.0.0.1:8080" 처럼 적는다. (기본값: ":8080")
  addr: "8080"

log:
  # 로그 레벨: debug | info | warn | error (기본값: info)
  level: info
  # 로그 파일 디렉터리. KST 날짜별로 mantong-YYYY-MM-DD.log 파일이 생성된다. (기본값: logs)
  dir: logs

mongodb:
  # MongoDB 접속 URI (필수). 아이디/비밀번호는 URI 에 넣지 말고 아래 user, password 항목에 적는다.
  uri: mongodb://localhost:27017
  # 사용할 데이터베이스 이름 (필수)
  database: stock
  # 인증 아이디. 인증을 사용하지 않으면 user, password 를 모두 비워 둔다. (둘 중 하나만 적으면 오류)
  user: ""
  # 인증 비밀번호. 특수문자도 escape 없이 그대로 적는다. 특수문자가 있으면 따옴표로 감싼다.
  password: ""
  # 연결 및 서버 선택 timeout. Go duration 형식 (예: 5s, 1m) (기본값: 10s)
  timeout: 10s
